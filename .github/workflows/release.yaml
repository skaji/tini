name: release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -o . -f maint/Dockerfile .
      - uses: actions/upload-artifact@v7
        with:
          name: tini-linux-${{ matrix.arch }}
          path: tini-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
  release:
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tini-linux-*
          merge-multiple: true
      - name: Create release and upload binaries
        run: gh release create "$TAG" tini-linux-amd64.tar.gz tini-linux-arm64.tar.gz --repo "$REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
